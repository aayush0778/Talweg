services:
  db:
    image: postgis/postgis:16-3.4
    container_name: slopeguard-db
    environment:
      POSTGRES_DB: slopeguard_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: slopeguard-ml
    ports:
      # Internal service — Node-only access, never browser-exposed
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
